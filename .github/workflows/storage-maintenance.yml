name: Storage Maintenance

on:
  schedule:
    - cron: "47 5 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: storage-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    name: Preserve production images and trim build storage
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Select package versions safe to delete
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: jedi-academy-pterodactyl
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          versions="$(
            gh api --paginate --slurp \
              "users/${owner}/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
              | jq -c '[.[][]]'
          )"

          unknown_tags="$(
            jq -r '
              [
                .[].metadata.container.tags[]?
                | select(
                    . != "latest"
                    and . != "taystjk"
                    and . != "taystjk-modern64"
                    and (startswith("taystjk-modern64-master-") | not)
                    and . != "jk2mv"
                    and (startswith("jk2mv-") | not)
                  )
              ]
              | unique
              | .[]
            ' <<<"$versions"
          )"
          if [[ -n "$unknown_tags" ]]; then
            echo "Refusing cleanup because unknown image tags exist:" >&2
            echo "$unknown_tags" >&2
            exit 1
          fi

          latest_id="$(jq -r '[.[] | select(.metadata.container.tags | index("latest"))] | if length == 1 then .[0].id else empty end' <<<"$versions")"
          taystjk_id="$(jq -r '[.[] | select(.metadata.container.tags | index("taystjk"))] | if length == 1 then .[0].id else empty end' <<<"$versions")"
          modern_id="$(jq -r '[.[] | select(.metadata.container.tags | index("taystjk-modern64"))] | if length == 1 then .[0].id else empty end' <<<"$versions")"
          jk2mv_id="$(jq -r '[.[] | select(.metadata.container.tags | index("jk2mv"))] | if length == 1 then .[0].id else empty end' <<<"$versions")"

          if [[ -z "$latest_id" || "$latest_id" != "$taystjk_id" || "$latest_id" != "$modern_id" ]]; then
            echo "Refusing cleanup: latest, taystjk, and taystjk-modern64 must identify one shared version." >&2
            exit 1
          fi
          if [[ -z "$jk2mv_id" ]]; then
            echo "Refusing cleanup: the canonical jk2mv version was not found." >&2
            exit 1
          fi

          taystjk_keep="$(
            jq -r '
              [
                .[]
                | select(
                    any(
                      .metadata.container.tags[]?;
                      . == "latest"
                      or . == "taystjk"
                      or . == "taystjk-modern64"
                      or startswith("taystjk-modern64-master-")
                    )
                  )
              ]
              | sort_by(.created_at)
              | reverse
              | .[0:3]
              | .[].id
            ' <<<"$versions"
          )"
          if [[ "$(wc -w <<<"$taystjk_keep")" -ne 3 ]] || ! grep -qx "$latest_id" <<<"$taystjk_keep"; then
            echo "Refusing cleanup: could not verify the current TaystJK version plus two rollback versions." >&2
            exit 1
          fi

          keep_ids="$(printf '%s\n%s\n' "$taystjk_keep" "$jk2mv_id" | sort -u)"
          delete_ids="$(
            jq -r '.[].id' <<<"$versions" \
              | grep -vxFf <(printf '%s\n' "$keep_ids") \
              | paste -sd, - \
              || true
          )"

          echo "Protected package version IDs:"
          echo "$keep_ids"
          echo "package_version_ids=${delete_ids}" >> "$GITHUB_OUTPUT"

      - name: Delete superseded and untagged package versions
        if: steps.versions.outputs.package_version_ids != ''
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: jedi-academy-pterodactyl
          package-type: container
          package-version-ids: ${{ steps.versions.outputs.package_version_ids }}

      - name: Delete Actions artifacts older than three days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '3 days ago' +%s)"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            | jq -r '.[].artifacts[] | [.id, .created_at] | @tsv' \
            | while IFS=$'\t' read -r artifact_id created_at; do
                if (( $(date -u -d "$created_at" +%s) < cutoff )); then
                  gh api --method DELETE \
                    "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
                fi
              done
